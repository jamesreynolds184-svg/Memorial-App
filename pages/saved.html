<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Memorials</title>
  <link rel="stylesheet" href="../css/style.css">  <script src="../js/theme.js"></script></head>
<body class="memorials-bg">
  <button id="burger-menu" class="burger-button" aria-label="Open menu">☰</button>

  <nav id="menu-items" aria-label="Main">
    <a href="../home.html">Home</a>
    <a href="map.html">Map</a>
    <a href="memorials.html">Find a Memorial</a>
    <a href="afm-list.html">Armed Forces Memorial</a>
    <a href="search-by-zone.html">Search by Zone</a>
    <a href="conflicts-by-year.html">Conflicts by Year</a>
    <a href="nearby-memorials.html">Nearby Memorials</a>
    <a href="routes.html">Routes</a>
    <a href="saved.html">Saved</a>
    
    <!-- Theme Toggle -->
    <div class="theme-toggle-container">
      <span class="theme-icon">☀️</span>
      <label class="theme-toggle-switch">
        <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode">
        <span class="theme-slider"></span>
      </label>
      <span class="theme-icon">🌙</span>
    </div>
  </nav>

  <div id="menu-overlay"></div>

  <!-- Global search button (before or after burger menu) -->
  <button id="global-search-btn" class="search-toggle" aria-label="Search memorials">🔍</button>

  <!-- Global search overlay (after menu overlay) -->
  <div id="global-search-panel" aria-hidden="true">
    <div class="gsp-inner">
      <button id="gsp-close" class="gsp-close" aria-label="Close search">✕</button>
      <input id="global-search-input"
             type="text"
             placeholder="Search memorial titles..."
             autocomplete="off"
             aria-autocomplete="list"
             aria-expanded="false">
      <label class="gsp-desc-label">
        <input type="checkbox" id="global-search-desc-checkbox">
        Search description
      </label>
      <ul id="global-search-results" role="listbox"></ul>
    </div>
  </div>

  <main class="hero">
    <div class="memorials-panel">
      <div class="toolbar">
        <input id="search" class="search-input" type="text" placeholder="Search saved memorials...">
        <button id="build-route-btn" class="btn btn-primary" style="margin-left: 10px;">📍 Build Route</button>
      </div>
      <ul id="memorial-list"></ul>
    </div>
  </main>

  <!-- Route Builder Modal -->
  <div id="route-builder-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center;">
    <div style="background: var(--panel-bg); padding: 2rem; border-radius: 8px; max-width: 500px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
      <h2>Build Your Route</h2>
      <p id="route-info"></p>
      <label for="route-name">Route Name:</label>
      <input type="text" id="route-name" class="search-input" placeholder="Enter route name..." style="width: 100%; margin: 10px 0;">
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button id="create-route-btn" class="btn btn-primary">Create Route</button>
        <button id="cancel-route-btn" class="btn btn-plain">Cancel</button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/saved.js"></script>
  <script src="../js/global-search.js"></script>
  <script src="../js/ios-menu.js"></script>
</body>
</html>
